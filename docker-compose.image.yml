name: ${WEBGL_GALLERY_COMPOSE_PROJECT:-webgl-gallery}

services:
  gallery:
    image: ${WEBGL_GALLERY_IMAGE:-ghcr.io/arisataki/webgl-gallery:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5279
      GALLERY_CONFIG_DIR: /app/.gallery
      GALLERY_PORTABLE_PATHS: "1"
      GALLERY_DATA_DIR: /app/public/data
      GALLERY_MEDIA_DIR: /app/public/media
      GALLERY_UPLOAD_DIR: /app/.uploads/tmp
      GALLERY_ORIGINAL_DIR: /app/.uploads/originals
      DATABASE_URL: ${DATABASE_URL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    ports:
      - "${WEBGL_GALLERY_PORT:-5279}:5279"
    volumes:
      - ./.gallery:/app/.gallery
      - ./.uploads:/app/.uploads
      - ./public/data:/app/public/data
      - ./public/media:/app/public/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5279/api/setup/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      gallery:
        condition: service_healthy
